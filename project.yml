# Projet Xcode généré par XcodeGen.
# Sur le Mac : `brew install xcodegen`, puis `xcodegen generate` à la racine.
name: GosRadars
options:
  bundleIdPrefix: com.imadmechri
  deploymentTarget:
    iOS: "17.0"
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    # Version vérifiée : 6.31.0, dernière release trouvée.
    from: "6.31.0"
targets:
  GosRadars:
    type: application
    platform: iOS
    sources: [GosRadars]
    dependencies:
      - package: MapLibre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imadmechri.gosradars
        INFOPLIST_FILE: GosRadars/Info.plist
        GENERATE_INFOPLIST_FILE: NO
  GosRadarsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GosRadarsTests]
    dependencies:
      - target: GosRadars
schemes:
  GosRadars:
    build:
      targets:
        GosRadars: all
        GosRadarsTests: [test]
    test:
      targets:
        - GosRadarsTests
