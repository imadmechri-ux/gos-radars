<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gos Radars</title>
<meta name="theme-color" content="#0C6B5B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Radars">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<style>
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --ink:#14302A; --muted:#5C736C; --line:#D9E2DC;
  --accent:#0C6B5B; --accent-ink:#FFFFFF; --accent-soft:#DDEDE7; --gold:#A8771C; --danger:#B3402E;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1917; --surface:#172522; --ink:#E4EEE9; --muted:#8FA59D; --line:#294039;
    --accent:#56C7AC; --accent-ink:#0E1917; --accent-soft:#1F3A33; --gold:#E0B25B; --danger:#F08A78;
    color-scheme:dark;
  }
}
/* Thèmes choisis par l'utilisateur (attribut data-theme sur <html>) */
:root[data-theme="night"]{--bg:#0F1720;--surface:#1A2633;--ink:#E6F1FF;--muted:#8AA0B5;--line:#2A3B4D;--accent:#33C6FF;--accent-ink:#04121C;--accent-soft:#16384A;--gold:#FFC23C;--danger:#FF5C5C;color-scheme:dark}
:root[data-theme="neon"]{--bg:#0B0B12;--surface:#16161F;--ink:#F2F2F7;--muted:#9A9AAE;--line:#2A2A38;--accent:#FF3EA5;--accent-ink:#120010;--accent-soft:#3A0F2B;--gold:#C6FF00;--danger:#FF6B6B;color-scheme:dark}
:root[data-theme="ocean"]{--bg:#0A1F3A;--surface:#12305A;--ink:#E8F6FF;--muted:#8FB3D9;--line:#1F4775;--accent:#2DD4BF;--accent-ink:#04201C;--accent-soft:#174A6A;--gold:#FACC15;--danger:#FB7185;color-scheme:dark}
:root[data-theme="sunset"]{--bg:#1E1028;--surface:#2A1738;--ink:#FFF1E6;--muted:#C4A3B8;--line:#41254D;--accent:#FF7A3D;--accent-ink:#220A02;--accent-soft:#4A2418;--gold:#FFD166;--danger:#FF4D8D;color-scheme:dark}
:root[data-theme="sand"]{--bg:#FBF4E8;--surface:#FFFFFF;--ink:#3B2A1A;--muted:#8A7360;--line:#EADBC6;--accent:#C8553D;--accent-ink:#FFFFFF;--accent-soft:#F6E1D9;--gold:#D98E04;--danger:#B42318;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#map{position:fixed;inset:0}
button,input{font:inherit}
button{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);min-height:44px}
button.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.5}

/* Colonne haute : guidage, radars, recherche */
.top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.top > *{pointer-events:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.step{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--accent);color:var(--accent-ink);border-color:transparent}
.step .arrow{font-size:34px;line-height:1;min-width:44px;text-align:center}
.step .dist{font-size:22px;font-weight:800}
.step .txt{font-size:14px;opacity:.95;margin-top:2px}
.step{position:relative;padding-right:60px}
.gear-nav{position:absolute;top:10px;right:10px;width:44px;min-width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;background:rgba(255,255,255,.28);color:var(--accent-ink);font-size:22px}
.step .trip{white-space:normal;overflow:visible;font-size:13px;font-weight:600;margin-top:4px;color:var(--accent-ink);opacity:.95}
.pill{padding:10px 14px;font-size:15px;font-weight:700}
.pill.alert{border-color:var(--gold)}
.pill.over{border-color:var(--danger);color:var(--danger)}
.pill small{display:block;font-weight:500;color:var(--muted);font-size:13px;margin-top:2px}

.search{padding:12px;display:flex;flex-direction:column;gap:10px;max-height:62vh;overflow:auto}
.search form{display:flex;gap:8px}
.search input{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px}
.search .chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;min-height:36px;font-size:13px;border-radius:999px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.opt{display:flex;flex-direction:column;gap:6px}
.opt .hint{font-size:12px;color:var(--muted)}
.results{display:flex;flex-direction:column;gap:8px}
.route{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:left;color:var(--ink);min-height:0}
.route[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
.route .t{font-size:18px;font-weight:800}
.route .m{font-size:13px;color:var(--muted);margin-top:2px}
.route .badges{font-size:12px;color:var(--muted);text-align:right}
.dests{display:flex;flex-direction:column;gap:6px}
.dests button{background:var(--bg);color:var(--ink);border:1px solid var(--line);text-align:left;font-weight:500;font-size:14px}
.favbtn{width:100%}
.search .gear{min-width:48px;width:48px;padding:0;font-size:22px;flex:0 0 auto}
.themes{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.themes .lbl{font-size:12px;color:var(--muted);font-weight:700;margin-right:4px}
.swatch{width:34px;height:34px;min-height:34px;min-width:34px;padding:0;border-radius:50%;border:2px solid var(--line);background:var(--c)}
.swatch[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.places{display:flex;flex-direction:column;gap:6px}
.places h4{margin:6px 0 0;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.place{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.place .go{flex:1;min-width:0;text-align:left;background:transparent;color:var(--ink);padding:8px 0;font-weight:600;font-size:14px;min-height:40px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.place .x{background:transparent;color:var(--muted);padding:4px 8px;min-height:36px;min-width:36px;font-size:18px}
.places > button.ghost{width:100%}

/* Barre basse */
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 10px calc(env(safe-area-inset-bottom) + 10px);background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:space-between;gap:8px}
.speedbox{min-width:72px;text-align:center}
.speed{font-size:38px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.speed.over{color:var(--danger)}
.unit{font-size:11px;color:var(--muted)}
.limit{width:50px;height:50px;border-radius:50%;border:4px solid #C0392B;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex:0 0 auto}
.limit.none{border-color:var(--line);color:var(--muted);background:var(--bg)}
.trip{flex:1;min-width:0;font-size:12px;color:var(--muted);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trip strong{color:var(--ink);font-size:17px;display:block}
.bar .icon{min-width:44px;padding:10px;font-size:18px}
.bar .alt{width:48px;min-width:48px;min-height:48px;padding:0;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.bar #stopNav{flex:0 0 auto;padding:12px 14px}
.note{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 96px);font-size:13px;color:var(--ink);text-align:center;pointer-events:none}
.note span{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 10px;display:inline-block}
.fab{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 104px);width:46px;min-width:46px;min-height:46px;padding:0;border-radius:50%;background:var(--surface);color:var(--ink);border:1px solid var(--line);font-size:20px}
.hidden{display:none !important}
.fab.report{bottom:calc(env(safe-area-inset-bottom) + 160px);background:var(--gold);color:#fff;border-color:transparent;font-weight:800}
.fab:disabled{opacity:.45}
.sheet2{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 100px);padding:12px;max-height:58vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
.sheet2 .title{font-weight:800;font-size:15px}
.sheet2-actions{display:flex;gap:8px}
.sheet2-actions button{flex:1}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.setrow strong{display:block;font-size:15px}
.setrow small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.toggle{min-width:96px;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-size:14px;padding:8px 12px;min-height:40px}
.toggle[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.setblock{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.setblock > strong{font-size:15px}
.sheet{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 100px);padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet .title{grid-column:1/-1;font-weight:800;font-size:15px}
.sheet button{background:var(--bg);color:var(--ink);border:1px solid var(--line);font-size:15px;min-height:52px;text-align:left}
.sheet .wide{grid-column:1/-1;text-align:center;background:transparent;color:var(--muted)}
.rpill{display:flex;flex-direction:column;gap:8px}
.rpill .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rpill .votes{display:flex;gap:8px;align-items:center}
.rpill .votes span{font-size:13px;color:var(--muted);margin-right:auto}
.rpill .votes button{min-height:38px;padding:8px 12px;font-size:14px}
</style>
</head>
<body>
<div id="map" role="region" aria-label="Carte"></div>

<div class="top">
  <div id="step" class="card step hidden" role="status" aria-live="polite">
    <div class="arrow" id="stepArrow">&#8593;</div>
    <div style="min-width:0">
      <div class="dist" id="stepDist"></div>
      <div class="txt" id="stepTxt"></div>
      <div class="trip" id="trip"></div>
    </div>
    <button type="button" class="gear-nav" id="settingsNav" aria-label="Paramètres" title="Paramètres">&#9881;</button>
  </div>

  <div id="radar" class="card pill hidden" role="status" aria-live="polite"></div>
  <div id="reportPill" class="card pill rpill hidden" role="status" aria-live="polite"></div>

  <section id="search" class="card search">
    <form id="searchForm">
      <input id="dest" type="search" placeholder="Où allez-vous ?" autocomplete="off" enterkeyhint="search" aria-label="Destination">
      <button type="submit">Chercher</button>
      <button type="button" class="ghost gear" id="settingsBtn" aria-label="Paramètres" title="Paramètres">&#9881;</button>
    </form>
    <div class="dests" id="dests"></div>
    <button type="button" class="ghost favbtn hidden" id="favDest">☆ Ajouter aux favoris</button>
    <div class="places" id="places"></div>

    <div class="opt">
      <div class="chips" role="group" aria-label="Options d'itinéraire">
        <button class="chip" data-opt="tolls" aria-pressed="false">Éviter péages</button>
        <button class="chip" data-opt="highways" aria-pressed="false">Éviter autoroutes</button>
        <button class="chip" data-opt="ferries" aria-pressed="false">Éviter ferries</button>
        <button class="chip" data-opt="unpaved" aria-pressed="false">Éviter pavés et chemins</button>
      </div>
      <div class="hint">Les options s'appliquent au prochain calcul d'itinéraire.</div>
    </div>

    <div class="results" id="results"></div>
    <button id="goBtn" class="hidden" type="button">Démarrer la navigation</button>
  </section>
</div>

<button class="fab report" id="reportBtn" aria-label="Signaler un événement" title="Signaler">!</button>
<button class="fab" id="locate" aria-label="Me recentrer" title="Me recentrer">&#9678;</button>

<div id="settings" class="card sheet2 hidden" role="dialog" aria-label="Paramètres">
  <div class="title">Paramètres</div>
  <div class="setrow"><div><strong>Voix du guidage</strong><small>« Dans 300 mètres, tournez… »</small></div>
    <button type="button" class="toggle" id="togGuide" aria-pressed="true">Activée</button></div>
  <div class="setrow"><div><strong>Alertes vocales</strong><small>Radars fixes, radars mobiles, contrôles</small></div>
    <button type="button" class="toggle" id="togAlerts" aria-pressed="true">Activées</button></div>
  <div class="setblock"><strong>Couleurs</strong>
    <div class="themes" id="themes"></div>
  </div>
  <div class="sheet2-actions"><button type="button" id="settingsClose">Fermer</button></div>
</div>
<div id="altSheet" class="card sheet2 hidden" role="dialog" aria-label="Autres itinéraires">
  <div class="title">Autres itinéraires</div>
  <div id="altList" class="results"></div>
  <div class="sheet2-actions">
    <button type="button" id="altGo">Suivre cet itinéraire</button>
    <button type="button" class="ghost" id="altClose">Fermer</button>
  </div>
</div>

<div id="sheet" class="card sheet hidden" role="dialog" aria-label="Signaler un événement">
  <div class="title">Signaler sur ma position</div>
  <button type="button" data-kind="radar_mobile">📷 Radar mobile</button>
  <button type="button" data-kind="controle">👮 Contrôle police</button>
  <button type="button" data-kind="accident">💥 Accident</button>
  <button type="button" data-kind="bouchon">🚗 Bouchon</button>
  <button type="button" data-kind="danger">⚠️ Danger sur la route</button>
  <button type="button" class="wide" id="sheetClose">Annuler</button>
</div>
<div class="note hidden" id="note"><span id="noteText"></span></div>

<div class="bar" id="bar">
  <div class="speedbox">
    <div class="speed" id="speed">--</div>
    <div class="unit">km/h</div>
  </div>
  <div class="limit none" id="limit" aria-label="Limite de vitesse">--</div>
  <button class="ghost icon" id="mute" aria-label="Couper la voix" title="Voix">&#128266;</button>
  <button class="ghost alt" id="altBtn" aria-label="Autres itinéraires" title="Autres itinéraires"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-8"/><path d="M12 13 6 4"/><path d="M12 13l6-9"/></svg></button>
  <button id="stopNav" class="hidden" type="button">Quitter</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(() => {
  "use strict";

  // ---------- Réglages ----------
  const STYLE_URL = "https://tiles.openfreemap.org/styles/liberty";
  const VALHALLA = "https://valhalla1.openstreetmap.de";
  const NOMINATIM = "https://nominatim.openstreetmap.org/search";
  const ALERT_DIST = 700;     // m : annonce d'un radar
  const LIST_DIST = 1000;     // m : radar affiché
  const RESET_DIST = 1200;    // m : libère un radar déjà annoncé
  const AHEAD_ANGLE = 45;     // degrés autour du cap
  const MIN_KMH_HEADING = 5;
  const OFF_ROUTE_M = 60;     // m : au-delà, hors itinéraire
  const OFF_ROUTE_COUNT = 3;  // mesures consécutives avant recalcul
  const LIMIT_EVERY_MS = 12000;
  const LIMIT_EVERY_M = 150;

  const $ = (id) => document.getElementById(id);

  // Préférences d'itinéraire (mémorisées sur l'appareil)
  const OPTS = { tolls: false, highways: false, ferries: false, unpaved: false };
  try { Object.assign(OPTS, JSON.parse(localStorage.getItem("gr-opts") || "{}")); } catch (e) { /* ignoré */ }

  const state = {
    radars: [], pos: null, prevPos: null, kmh: null, course: null,
    trail: [], limit: null, lastLimitAt: 0, lastLimitPos: null, limitBusy: false,
    alerted: new Set(), wakeLock: null, voiceReady: false, muted: false,
    followUser: true, dest: null, routes: [], routeIdx: 0, route: null,
    nav: false, stepIdx: 0, spoken: {}, offCount: 0, rerouting: false,
  };

  // ---------- Géométrie ----------
  const R = 6371000;
  const rad = (d) => d * Math.PI / 180;
  const deg = (r) => r * 180 / Math.PI;
  function distance(a, b) {
    const dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
  }
  function bearing(a, b) {
    const dLon = rad(b.lon - a.lon);
    const y = Math.sin(dLon) * Math.cos(rad(b.lat));
    const x = Math.cos(rad(a.lat)) * Math.sin(rad(b.lat)) - Math.sin(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.cos(dLon);
    return (deg(Math.atan2(y, x)) + 360) % 360;
  }
  function angleDiff(a, b) { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; }

  // Décodage polyline (précision 1e-6), format Valhalla
  function decodePolyline(str) {
    const pts = []; let i = 0, lat = 0, lon = 0;
    while (i < str.length) {
      for (let k = 0; k < 2; k++) {
        let shift = 0, res = 0, b;
        do { b = str.charCodeAt(i++) - 63; res |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        const v = (res & 1) ? ~(res >> 1) : (res >> 1);
        if (k === 0) lat += v; else lon += v;
      }
      pts.push({ lat: lat / 1e6, lon: lon / 1e6 });
    }
    return pts;
  }

  function fmtDist(m) {
    if (m < 1000) return `${Math.max(0, Math.round(m / 10) * 10)} m`;
    return `${(m / 1000).toFixed(m < 10000 ? 1 : 0).replace(".", ",")} km`;
  }
  function fmtDuration(s) {
    const m = Math.round(s / 60);
    if (m < 60) return `${m} min`;
    return `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")}`;
  }
  function fmtClock(date) {
    return date.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  }

  // ---------- Messages ----------
  let noteTimer = null;
  function status(text, ms = 4000) {
    $("noteText").textContent = text;
    $("note").classList.remove("hidden");
    clearTimeout(noteTimer);
    if (ms) noteTimer = setTimeout(() => $("note").classList.add("hidden"), ms);
  }

  // ---------- Voix et écran allumé ----------
  // Réglages de son (sur cet appareil) : guidage et alertes séparés
  const SOUND = { guide: true, alerts: true };
  try {
    const saved = JSON.parse(localStorage.getItem("gr-sound") || "{}");
    if (typeof saved.guide === "boolean") SOUND.guide = saved.guide;
    if (typeof saved.alerts === "boolean") SOUND.alerts = saved.alerts;
  } catch (e) { /* ignoré */ }
  function saveSound() {
    try { localStorage.setItem("gr-sound", JSON.stringify(SOUND)); } catch (e) { /* ignoré */ }
  }

  function speak(text, kind = "guide") {
    if (!SOUND[kind === "alert" ? "alerts" : "guide"] || !("speechSynthesis" in window)) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "fr-FR"; u.rate = 1.05;
    speechSynthesis.speak(u);
  }
  function unlockVoice() {
    if (state.voiceReady || !("speechSynthesis" in window)) return;
    speechSynthesis.speak(new SpeechSynthesisUtterance(""));
    state.voiceReady = true;
  }
  async function keepAwake() {
    try { if ("wakeLock" in navigator) state.wakeLock = await navigator.wakeLock.request("screen"); } catch (e) { /* indisponible */ }
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") keepAwake();
  });

  // ---------- Carte ----------
  const map = new maplibregl.Map({
    container: "map", style: STYLE_URL, center: [2.35, 46.6], zoom: 5.5,
    attributionControl: { compact: true },
  });
  map.addControl(new maplibregl.NavigationControl({ showCompass: true, showZoom: false }), "top-right");
  map.on("dragstart", () => { state.followUser = false; });

  const userEl = document.createElement("div");
  userEl.style.cssText = "width:18px;height:18px;border-radius:50%;background:#0C6B5B;border:3px solid #fff;box-shadow:0 0 0 2px rgba(12,107,91,.35)";
  const userMarker = new maplibregl.Marker({ element: userEl });
  const destMarker = new maplibregl.Marker({ color: "#B3402E" });

  // ---------- Recherche d'adresse ----------
  async function geocode(q) {
    const url = `${NOMINATIM}?format=jsonv2&limit=5&accept-language=fr&countrycodes=fr&q=${encodeURIComponent(q)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("geocode");
    return (await res.json()).map((x) => ({ name: x.display_name, lat: +x.lat, lon: +x.lon }));
  }

  function showDestinations(list) {
    const box = $("dests");
    box.innerHTML = "";
    for (const d of list) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = d.name.length > 90 ? d.name.slice(0, 88) + "…" : d.name;
      b.addEventListener("click", () => chooseDestination(d));
      box.appendChild(b);

  async function chooseDestination(d) {
    state.dest = d;
    addHistory(d);
    updateFavBtn();
    destMarker.setLngLat([d.lon, d.lat]).addTo(map);
    $("dests").innerHTML = "";
    await computeRoutes();

  $("searchForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    unlockVoice();
    const q = $("dest").value.trim();
    if (!q) return;
    status("Recherche de l'adresse…", 0);
    try {
      const list = await geocode(q);
      if (!list.length) { status("Adresse introuvable", 4000); return; }
      $("note").classList.add("hidden");
      if (list.length === 1) chooseDestination(list[0]);
      else showDestinations(list);
    } catch (err) { status("Recherche impossible, vérifiez la connexion", 5000); }
  });

  // ---------- Itinéraires ----------
  function parseTrip(trip) {
    let pts = []; const steps = [];
    for (const leg of trip.legs) {
      const legPts = decodePolyline(leg.shape);
      const offset = pts.length;
      pts = pts.concat(legPts);
      for (const m of leg.maneuvers) {
        const idx = offset + (m.begin_shape_index || 0);
        steps.push({ text: m.instruction, idx, pt: pts[idx] || legPts[0] });
      }
    }
    const cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + distance(pts[i - 1], pts[i]));
    const s = trip.summary;
    return {
      pts, cum, total: cum[cum.length - 1] || 1, steps,
      km: s.length, time: s.time,
      toll: !!s.has_toll, highway: !!s.has_highway, ferry: !!s.has_ferry,
    };
  }

  // Trois itinéraires différents : le recommandé, puis sans péage, puis sans autoroute.
  // Chaque variante reprend les préférences de l'utilisateur, puis ajoute une contrainte.
  const VARIANTS = [
    { label: "Recommandé", over: {} },
    { label: "Sans péage", over: { tolls: true } },
    { label: "Sans autoroute", over: { highways: true } },
  ];

  function routeBody(over) {
    const o = Object.assign({}, OPTS, over);
    return {
      locations: [{ lat: state.pos.lat, lon: state.pos.lon }, { lat: state.dest.lat, lon: state.dest.lon }],
      costing: "auto",
      costing_options: { auto: {
        use_tolls: o.tolls ? 0 : 1,
        use_highways: o.highways ? 0 : 1,
        use_ferry: o.ferries ? 0 : 1,
        exclude_unpaved: o.unpaved,
      } },
      alternates: 2,
      directions_options: { units: "kilometers", language: "fr-FR" },
    };
  }

  async function fetchRoutes(body) {
    const res = await fetch(`${VALHALLA}/route`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok || !data.trip) throw new Error(data.error || "route");
    return [data.trip, ...((data.alternates || []).map((a) => a.trip))].filter(Boolean).map(parseTrip);
  }

  // Jusqu'à 3 itinéraires distincts (deux trajets de même durée et distance sont des doublons).
  // D'abord le trajet principal de chaque variante, puis les alternatives.
  async function fetchRouteVariants() {
    const settled = await Promise.allSettled(VARIANTS.map((v) => fetchRoutes(routeBody(v.over))));
    const kept = [];
    const add = (r, label) => {
      const dup = kept.some((k) => Math.abs(k.time - r.time) < 60 && Math.abs(k.km - r.km) < 0.5);
      if (!dup && kept.length < 3) { r.label = label; kept.push(r); }
    };
    settled.forEach((res, vi) => { if (res.status === "fulfilled" && res.value[0]) add(res.value[0], VARIANTS[vi].label); });
    settled.forEach((res) => { if (res.status === "fulfilled") res.value.slice(1).forEach((r) => add(r, "Alternative")); });
    return kept;
  }

  async function computeRoutes() {
    if (!state.pos) { status("Position GPS indisponible. Patientez quelques secondes."); return false; }
    if (!state.dest) return false;
    status("Calcul des itinéraires…", 0);
    try {
      const routes = await fetchRouteVariants();
      if (!routes.length) throw new Error("none");
      state.routes = routes;
      state.routeIdx = 0;
      $("note").classList.add("hidden");
      renderRoutes();
      selectRoute(0);
      return true;
    } catch (err) {
      state.routes = [];
      $("results").innerHTML = "";
      status("Aucun itinéraire avec ces options. Essayez d'en désactiver une.", 6000);
      return false;
    }
  }

  function renderList(box, list, sel, onPick) {
    box.innerHTML = "";
    const now = Date.now();
    list.forEach((r, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "route";
      b.dataset.i = i;
      b.setAttribute("aria-selected", String(i === sel));
      const tags = [r.toll ? "péages" : "sans péage", r.highway ? "autoroute" : "hors autoroute", r.ferry ? "ferry" : ""].filter(Boolean).join(" · ");
      const arrive = new Date(now + r.time * 1000);
      b.innerHTML = `<div><div class="t">${fmtDuration(r.time)}</div><div class="m">${fmtDist(r.km * 1000)} · arrivée ${fmtClock(arrive)}</div></div>
                     <div class="badges">${r.label || ""}<br>${tags}</div>`;
      b.addEventListener("click", () => onPick(i));
      box.appendChild(b);
    });
  }

  function renderRoutes() {
    renderList($("results"), state.routes, state.routeIdx, selectRoute);
    $("goBtn").classList.toggle("hidden", !state.routes.length);
  }

  function drawLines(list, sel) {
    const src = map.getSource("routes");
    if (!src) return;
    src.setData({
      type: "FeatureCollection",
      features: list.map((x, j) => ({
        type: "Feature", properties: { sel: j === sel },
        geometry: { type: "LineString", coordinates: x.pts.map((p) => [p.lon, p.lat]) },
      })).sort((a, b) => (a.properties.sel ? 1 : 0) - (b.properties.sel ? 1 : 0)),
    });
  }

  function selectRoute(i) {
    const r = state.routes[i];
    if (!r) return;
    state.routeIdx = i;
    drawLines(state.routes, i);
    renderRoutes();
    if (state.nav) return; // pendant le guidage, on ne recadre pas la carte
    const bounds = new maplibregl.LngLatBounds();
    r.pts.forEach((p) => bounds.extend([p.lon, p.lat]));
    state.followUser = false;
    map.fitBounds(bounds, { padding: { top: 260, bottom: 170, left: 40, right: 40 }, duration: 600 });
  }

  // ---------- Favoris et récentes (mémorisés sur cet appareil) ----------
  const PLACES = { hist: [], favs: [] };
  function loadPlaces() {
    try { PLACES.hist = JSON.parse(localStorage.getItem("gr-hist") || "[]"); } catch (e) { PLACES.hist = []; }
    try { PLACES.favs = JSON.parse(localStorage.getItem("gr-favs") || "[]"); } catch (e) { PLACES.favs = []; }
  }
  function savePlaces() {
    try {
      localStorage.setItem("gr-hist", JSON.stringify(PLACES.hist));
      localStorage.setItem("gr-favs", JSON.stringify(PLACES.favs));
    } catch (e) { /* ignoré */ }
  }
  const samePlace = (a, b) => Math.abs(a.lat - b.lat) < 1e-4 && Math.abs(a.lon - b.lon) < 1e-4;
  const shortName = (name) => name.split(",").slice(0, 2).join(",").trim();

  function addHistory(d) {
    PLACES.hist = [{ name: d.name, lat: d.lat, lon: d.lon }, ...PLACES.hist.filter((p) => !samePlace(p, d))].slice(0, 10);
    savePlaces();
    renderPlaces();
  }
  function isFavorite(d) { return PLACES.favs.some((p) => samePlace(p, d)); }
  function toggleFavorite(d) {
    if (isFavorite(d)) {
      PLACES.favs = PLACES.favs.filter((p) => !samePlace(p, d));
    } else {
      const label = prompt("Nom de ce favori :", shortName(d.name));
      if (!label || !label.trim()) return;
      PLACES.favs = [{ name: label.trim(), lat: d.lat, lon: d.lon }, ...PLACES.favs];
    }
    savePlaces();
    renderPlaces();
    updateFavBtn();
  }
  function updateFavBtn() {
    const btn = $("favDest");
    if (!state.dest) { btn.classList.add("hidden"); return; }
    btn.classList.remove("hidden");
    btn.textContent = isFavorite(state.dest) ? "★ Retirer des favoris" : "☆ Ajouter aux favoris";
  }
  function placeRow(p, onRemove, label) {
    const row = document.createElement("div");
    row.className = "place";
    const go = document.createElement("button");
    go.type = "button"; go.className = "go"; go.textContent = label || p.name;
    go.addEventListener("click", () => chooseDestination(p));
    const x = document.createElement("button");
    x.type = "button"; x.className = "x"; x.textContent = "×";
    x.setAttribute("aria-label", "Supprimer");
    x.addEventListener("click", onRemove);
    row.append(go, x);
    return row;
  }
  function renderPlaces() {
    const box = $("places");
    box.innerHTML = "";
    if (PLACES.favs.length) {
      const h = document.createElement("h4"); h.textContent = "★ Favoris"; box.appendChild(h);
      PLACES.favs.forEach((p) => box.appendChild(placeRow(p, () => {
        PLACES.favs = PLACES.favs.filter((x) => x !== p);
        savePlaces(); renderPlaces(); updateFavBtn();
      })));
    }
    if (PLACES.hist.length) {
      const h = document.createElement("h4"); h.textContent = "Récentes"; box.appendChild(h);
      PLACES.hist.forEach((p) => box.appendChild(placeRow(p, () => {
        PLACES.hist = PLACES.hist.filter((x) => x !== p);
        savePlaces(); renderPlaces();
      }, shortName(p.name))));
      const clear = document.createElement("button");
      clear.type = "button"; clear.className = "ghost"; clear.textContent = "Effacer l'historique";
      clear.addEventListener("click", () => { PLACES.hist = []; savePlaces(); renderPlaces(); });
      box.appendChild(clear);
    }
  }

  // ---------- Autres itinéraires, à tout moment ----------
  async function showAlternatives() {
    if (!state.dest || !state.pos) { status("Choisissez d'abord une destination", 4000); return; }
    status("Recherche de 3 itinéraires…", 0);
    try {
      const alts = await fetchRouteVariants();
      if (!alts.length) throw new Error("none");
      state.altRoutes = alts;
      state.altIdx = 0;
      $("note").classList.add("hidden");
      renderAlternatives();
      $("altSheet").classList.remove("hidden");
    } catch (e) {
      status("Aucun autre itinéraire trouvé", 4000);
    }
  }

  function renderAlternatives() {
    renderList($("altList"), state.altRoutes, state.altIdx, pickAlternative);
    drawLines(state.altRoutes, state.altIdx);
  }

  function pickAlternative(i) {
    state.altIdx = i;
    renderAlternatives();
  }

  function closeAlternatives() {
    $("altSheet").classList.add("hidden");
    if (state.nav && state.route) drawLines([state.route], 0);
    else if (state.routes.length) drawLines(state.routes, state.routeIdx);
  }

  function chooseAlternative() {
    const r = state.altRoutes[state.altIdx];
    if (!r) return;
    $("altSheet").classList.add("hidden");
    if (state.nav) {
      state.route = r;
      state.stepIdx = 0; state.spoken = {}; state.offCount = 0;
      drawLines([r], 0);
      updateNavigation();
      speak(`Nouvel itinéraire : ${r.label.toLowerCase()}`);
    } else {
      state.routes = state.altRoutes;
      state.routeIdx = state.altIdx;
      selectRoute(state.routeIdx);
      status(`Itinéraire « ${r.label} » sélectionné`, 2500);
    }
  }

  // Changement d'options : recalcul immédiat si un trajet est en cours de préparation
  document.querySelectorAll(".chip").forEach((btn) => {
    const key = btn.dataset.opt;
    btn.setAttribute("aria-pressed", String(!!OPTS[key]));
    btn.addEventListener("click", () => {
      OPTS[key] = !OPTS[key];
      btn.setAttribute("aria-pressed", String(OPTS[key]));
      try { localStorage.setItem("gr-opts", JSON.stringify(OPTS)); } catch (e) { /* ignoré */ }
      if (state.dest && !state.nav) computeRoutes();
    });
  });

  // ---------- Navigation ----------
  function startNav() {
    if (!state.routes.length) return;
    unlockVoice();
    keepAwake();
    state.route = state.routes[state.routeIdx];
    state.nav = true;
    state.stepIdx = 0; state.spoken = {}; state.offCount = 0;
    $("search").classList.add("hidden");
    $("step").classList.remove("hidden");
    $("stopNav").classList.remove("hidden");
    state.followUser = true;
    map.easeTo({ zoom: 17, pitch: 45, duration: 600 });
    updateNavigation();
    if (state.route.steps[0]) speak(`Itinéraire démarré. ${state.route.steps[0].text}`);
  }

  function stopNav() {
    state.nav = false; state.route = null;
    $("step").classList.add("hidden");
    $("stopNav").classList.add("hidden");
    $("search").classList.remove("hidden");
    $("trip").textContent = "Position en cours";
    map.easeTo({ bearing: 0, pitch: 0, duration: 500 });
    map.getSource("routes").setData({ type: "FeatureCollection", features: [] });
    destMarker.remove();
    state.dest = null; state.routes = [];
    updateFavBtn();
    $("results").innerHTML = "";
    $("goBtn").classList.add("hidden");
  }

  async function reroute() {
    if (state.rerouting || !state.nav) return;
    state.rerouting = true;
    status("Recalcul de l'itinéraire…", 0);
    try {
      await computeRoutes();
      if (state.routes.length) {
        state.routeIdx = 0; state.route = state.routes[0];
        drawLines([state.route], 0);
        state.stepIdx = 0; state.spoken = {};
        startNavKeepingView();
        status("Itinéraire recalculé", 2500);
      }
    } finally { state.rerouting = false; state.offCount = 0; }
  }
  function startNavKeepingView() {
    state.nav = true;
    $("search").classList.add("hidden");
    $("step").classList.remove("hidden");
    $("stopNav").classList.remove("hidden");
  }

  function nearestIndex(pos, pts) {
    let best = 0, bestD = Infinity;
    for (let i = 0; i < pts.length; i++) {
      const d = distance(pos, pts[i]);
      if (d < bestD) { bestD = d; best = i; }
    }
    return { i: best, d: bestD };
  }

  function updateNavigation() {
    const r = state.route;
    if (!r || !state.pos) return;
    const { i, d } = nearestIndex(state.pos, r.pts);

    // Hors itinéraire
    if (d > OFF_ROUTE_M) {
      state.offCount++;
      if (state.offCount >= OFF_ROUTE_COUNT) { reroute(); return; }
    } else state.offCount = 0;

    // Étape suivante
    while (state.stepIdx < r.steps.length - 1 && i >= r.steps[state.stepIdx].idx) state.stepIdx++;
    const step = r.steps[state.stepIdx];
    const remaining = Math.max(0, r.total - r.cum[i]);
    const toStep = Math.max(0, r.cum[step.idx] - r.cum[i]);

    $("stepDist").textContent = state.stepIdx === r.steps.length - 1 ? `Arrivée dans ${fmtDist(remaining)}` : `Dans ${fmtDist(toStep)}`;
    $("stepTxt").textContent = step.text;

    // Annonces vocales
    const sp = state.spoken[state.stepIdx] || (state.spoken[state.stepIdx] = {});
    if (toStep <= 400 && toStep > 60 && !sp.far) { sp.far = true; speak(`Dans ${fmtDist(toStep)}, ${step.text}`); }
    if (toStep <= 60 && !sp.near) { sp.near = true; speak(step.text); }

    // Arrivée
    if (remaining < 30 && state.stepIdx === r.steps.length - 1) {
      speak("Vous êtes arrivé à destination.");
      status("Arrivée à destination", 6000);
      setTimeout(stopNav, 6000);
      return;
    }

    const frac = remaining / r.total;
    const etaSec = r.time * frac;
    $("trip").innerHTML = `<strong>${fmtDuration(etaSec)}</strong>${fmtDist(remaining)} · arrivée ${fmtClock(new Date(Date.now() + etaSec * 1000))}`;
  }

  // ---------- Limite de vitesse (tronçon en cours, via Valhalla trace_attributes) ----------
  async function refreshLimit() {
    if (state.limitBusy || state.trail.length < 2) return;
    state.limitBusy = true;
    state.lastLimitAt = Date.now();
    state.lastLimitPos = state.pos;
    try {
      const body = {
        shape: state.trail.slice(-3), costing: "auto", shape_match: "map_snap",
        filters: { attributes: ["edge.speed_limit"], action: "include" },
      };
      const res = await fetch(`${VALHALLA}/trace_attributes`, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
      });
      if (res.ok) {
        const data = await res.json();
        const withLimit = (data.edges || []).filter((e) => e && e.speed_limit);
        state.limit = withLimit.length ? withLimit[withLimit.length - 1].speed_limit : null;
      }
    } catch (e) { /* on garde la dernière valeur */ }
    finally { state.limitBusy = false; renderLimit(); }
  }
  function renderLimit() {
    const el = $("limit");
    if (state.limit) { el.textContent = state.limit; el.classList.remove("none"); }
    else { el.textContent = "--"; el.classList.add("none"); }
  }

  // ---------- Radars ----------
  function aheadRadars() {
    const pos = state.pos;
    const list = [];
    const moving = state.course != null && (state.kmh ?? 0) >= MIN_KMH_HEADING;
    for (const r of state.radars) {
      if (Math.abs(r.lat - pos.lat) > 0.03 || Math.abs(r.lon - pos.lon) > 0.03) continue;
      const d = distance(pos, r);
      if (d > LIST_DIST) continue;
      const ahead = !moving || angleDiff(state.course, bearing(pos, r)) <= AHEAD_ANGLE || d < 60;
      if (ahead) list.push({ r, d });
    }
    return list.sort((a, b) => a.d - b.d);
  }

  function checkRadars() {
    const pos = state.pos;
    for (const id of [...state.alerted]) {
      const r = state.radars.find((x) => x.id === id);
      if (!r || distance(pos, r) > RESET_DIST) state.alerted.delete(id);
    }
    const list = aheadRadars();
    const box = $("radar");
    if (!list.length) { box.classList.add("hidden"); return; }

    const { r, d } = list[0];
    const dist = fmtDist(d);
    const over = r.vma && state.kmh != null && state.kmh > r.vma + 5;
    box.className = "card pill hidden" + (over ? " over" : " alert");
    box.classList.remove("hidden");
    box.innerHTML = `Radar fixe à ${dist}<small>${r.vma ? `Limite ${r.vma} km/h` : "Limite inconnue"}${over ? ` · vous roulez à ${Math.round(state.kmh)} km/h` : ""}</small>`;

    if (d <= ALERT_DIST && !state.alerted.has(r.id)) {
      state.alerted.add(r.id);
      speak(`Radar fixe dans ${Math.round(d / 10) * 10} mètres${r.vma ? `, limite ${r.vma}` : ""}`, "alert");
    }
  }

  // ---------- Position ----------
  function onPosition(p) {
    const now = { lat: p.coords.latitude, lon: p.coords.longitude };
    if (p.coords.speed != null && p.coords.speed >= 0) state.kmh = p.coords.speed * 3.6;
    if (state.prevPos && distance(state.prevPos, now) > 5) {
      state.course = bearing(state.prevPos, now);
      if (state.kmh == null) state.kmh = 0;
    }
    if (p.coords.heading != null && !Number.isNaN(p.coords.heading) && (state.kmh ?? 0) >= MIN_KMH_HEADING) {
      state.course = p.coords.heading;
    }
    if (!state.prevPos || distance(state.prevPos, now) > 5) {
      state.trail.push(now);
      if (state.trail.length > 6) state.trail.shift();
    }
    state.prevPos = now;
    state.pos = now;

    $("speed").textContent = state.kmh == null ? "--" : String(Math.round(state.kmh));
    const over = state.limit && state.kmh != null && state.kmh > state.limit + 5;
    $("speed").classList.toggle("over", !!over);

    userMarker.setLngLat([now.lon, now.lat]).addTo(map);
    if (state.nav) {
      map.easeTo({
        center: [now.lon, now.lat], zoom: 17, duration: 500,
        bearing: state.course != null && (state.kmh ?? 0) >= MIN_KMH_HEADING ? state.course : map.getBearing(),
      });
    } else if (state.followUser) {
      map.easeTo({ center: [now.lon, now.lat], duration: 600 });
    }

    if (!state.lastLimitAt || Date.now() - state.lastLimitAt > LIMIT_EVERY_MS ||
        (state.lastLimitPos && distance(state.lastLimitPos, now) > LIMIT_EVERY_M)) refreshLimit();

    checkRadars();
    if (state.nav) updateNavigation();
    if (community.ready) {
      if (!community.lastFetchPos || distance(community.lastFetchPos, now) > 3000) {
        community.lastFetchPos = now;
        refreshReports(true);
      } else refreshReports(false);
      checkReports();
    }
  }

  function startTracking() {
    if (!("geolocation" in navigator)) { status("Géolocalisation indisponible sur cet appareil", 0); return; }
    keepAwake();
    navigator.geolocation.watchPosition(onPosition, (err) => {
      status(err.code === 1 ? "Localisation refusée : autorisez-la dans les réglages" : "Position indisponible pour le moment", 0);
    }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
  }

  // Marqueur de position : suit le GPS, sans attendre la carte
  setInterval(() => { renderLimit(); }, 5000);

  // ---------- Communauté (Supabase) ----------
  const KINDS = {
    radar_mobile: { label: "Radar mobile", icon: "📷", color: "#7B3FBF", say: "radar mobile" },
    controle:     { label: "Contrôle police", icon: "👮", color: "#1F5FBF", say: "contrôle de police" },
    accident:     { label: "Accident", icon: "💥", color: "#B3402E", say: "accident" },
    bouchon:      { label: "Bouchon", icon: "🚗", color: "#D98B00", say: "bouchon" },
    danger:       { label: "Danger", icon: "⚠️", color: "#B3402E", say: "danger" },
  };
  const cfg = window.GR_CONFIG || {};
  const sb = (cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY && window.supabase)
    ? window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } })
    : null;
  const community = { ready: false, uid: null, reports: [], lastFetchAt: 0, lastFetchPos: null,
                      asked: new Set(), announced: new Set(), lastSent: {}, pillId: null };

  async function initCommunity() {
    if (!sb) {
      $("reportBtn").disabled = true;
      $("reportBtn").title = "Communauté non configurée (voir config.js)";
      return;
    }
    try {
      let { data } = await sb.auth.getSession();
      if (!data.session) {
        const res = await sb.auth.signInAnonymously();
        if (res.error) throw res.error;
        data = res.data;
      }
      community.uid = data.session.user.id;
      community.ready = true;
      sb.channel("reports-live")
        .on("postgres_changes", { event: "*", schema: "public", table: "reports" }, () => refreshReports(true))
        .subscribe();
      refreshReports(true);
    } catch (e) {
      status("Communauté indisponible (voir la configuration Supabase)", 6000);
    }
  }

  async function refreshReports(force) {
    if (!community.ready || !state.pos) return;
    const now = Date.now();
    if (!force && now - community.lastFetchAt < 60000) return;
    community.lastFetchAt = now;
    const p = state.pos, dLat = 0.1, dLon = 0.15; // zone d'environ 11 km autour de la position
    const { data, error } = await sb.from("reports")
      .select("id,kind,lat,lon,created_at,expires_at,confirmations,denials")
      .gte("lat", p.lat - dLat).lte("lat", p.lat + dLat)
      .gte("lon", p.lon - dLon).lte("lon", p.lon + dLon)
      .limit(500);
    if (error || !data) return;
    community.reports = data;
    updateReportLayer();
  }

  function updateReportLayer() {
    const src = map.getSource("reports");
    if (!src) return;
    const nowMs = Date.now();
    src.setData({
      type: "FeatureCollection",
      features: community.reports
        .filter((r) => new Date(r.expires_at).getTime() > nowMs && KINDS[r.kind])
        .map((r) => ({ type: "Feature", properties: { id: r.id, color: KINDS[r.kind].color },
          geometry: { type: "Point", coordinates: [r.lon, r.lat] } })),
    });
  }

  async function sendReport(kind) {
    if (!community.ready) { status("Communauté non configurée", 4000); return; }
    if (!state.pos) { status("Position GPS indisponible", 4000); return; }
    const last = community.lastSent[kind] || 0;
    if (Date.now() - last < 30000) { status("Attendez un instant avant un nouveau signalement", 3000); return; }
    community.lastSent[kind] = Date.now();
    const { error } = await sb.from("reports").insert({ kind, lat: state.pos.lat, lon: state.pos.lon });
    if (error) {
      status(/Trop de signalements/.test(error.message) ? error.message : "Signalement impossible", 5000);
      return;
    }
    status(`Merci : ${KINDS[kind].say} signalé`, 3000);
    refreshReports(true);
  }

  async function vote(reportId, stillThere) {
    const { error } = await sb.from("report_votes").upsert(
      { report_id: reportId, user_id: community.uid, still_there: stillThere },
      { onConflict: "report_id,user_id" });
    if (error) { status("Vote impossible", 3000); return; }
    community.asked.add(reportId);
    community.pillId = null;
    $("reportPill").classList.add("hidden");
    status(stillThere ? "Merci, signalement confirmé" : "Merci, signalement retiré", 2500);
    refreshReports(true);
  }

  // Signalements proches devant soi : annonce et question « toujours là ? »
  function checkReports() {
    const pos = state.pos;
    const now = Date.now();
    const moving = state.course != null && (state.kmh ?? 0) >= MIN_KMH_HEADING;
    let best = null;
    for (const r of community.reports) {
      if (!KINDS[r.kind] || community.asked.has(r.id) || new Date(r.expires_at).getTime() <= now) continue;
      const d = distance(pos, { lat: r.lat, lon: r.lon });
      if (d > LIST_DIST) continue;
      const ahead = !moving || d < 60 || angleDiff(state.course, bearing(pos, { lat: r.lat, lon: r.lon })) <= AHEAD_ANGLE;
      if (!ahead) continue;
      if (!best || d < best.d) best = { r, d };
    }
    const pill = $("reportPill");
    if (!best) { pill.classList.add("hidden"); community.pillId = null; return; }

    const { r, d } = best;
    const k = KINDS[r.kind];
    if (community.pillId !== r.id) {
      community.pillId = r.id;
      pill.innerHTML = "";
      const row = document.createElement("div");
      row.className = "row";
      const title = document.createElement("strong");
      title.textContent = `${k.icon} ${k.label}`;
      const dist = document.createElement("span");
      dist.id = "reportDist";
      dist.style.color = "var(--muted)";
      row.append(title, dist);
      const votes = document.createElement("div");
      votes.className = "votes";
      const q = document.createElement("span");
      q.textContent = "Toujours là ?";
      const yes = document.createElement("button");
      yes.type = "button"; yes.className = "ghost"; yes.textContent = "Oui";
      yes.addEventListener("click", () => vote(r.id, true));
      const no = document.createElement("button");
      no.type = "button"; no.className = "ghost"; no.textContent = "Non";
      no.addEventListener("click", () => vote(r.id, false));
      votes.append(q, yes, no);
      pill.append(row, votes);
    }
    $("reportDist").textContent = `à ${fmtDist(d)}`;
    pill.classList.remove("hidden");
    if (d <= 500 && !community.announced.has(r.id)) {
      community.announced.add(r.id);
      speak(`Attention, ${k.say} signalé à ${Math.round(d / 10) * 10} mètres`, "alert");
    }
  }

  $("reportBtn").addEventListener("click", () => {
    if (!community.ready) { status("Communauté non configurée", 4000); return; }
    $("sheet").classList.remove("hidden");
  });
  $("sheetClose").addEventListener("click", () => $("sheet").classList.add("hidden"));
  document.querySelectorAll("#sheet [data-kind]").forEach((b) => {
    b.addEventListener("click", () => {
      $("sheet").classList.add("hidden");
      sendReport(b.dataset.kind);
    });
  });

  // ---------- Thèmes de couleurs ----------
  const THEMES = [
    { id: "auto",   name: "Auto",             swatch: "#0C6B5B", route: "#0C6B5B" },
    { id: "night",  name: "Nuit (cyan)",      swatch: "#33C6FF", route: "#33C6FF" },
    { id: "neon",   name: "Néon",             swatch: "#FF3EA5", route: "#FF3EA5" },
    { id: "ocean",  name: "Océan",            swatch: "#2DD4BF", route: "#2DD4BF" },
    { id: "sunset", name: "Coucher de soleil", swatch: "#FF7A3D", route: "#FF7A3D" },
    { id: "sand",   name: "Sable",            swatch: "#C8553D", route: "#C8553D" },
  ];
  let currentTheme = "auto";
  try { currentTheme = localStorage.getItem("gr-theme") || "auto"; } catch (e) { /* ignoré */ }

  function routeColor() {
    return (THEMES.find((t) => t.id === currentTheme) || THEMES[0]).route;
  }
  function applyRouteColor() {
    if (map.getLayer("routes")) map.setPaintProperty("routes", "line-color", ["case", ["get", "sel"], routeColor(), "#8A9A95"]);
  }
  function setTheme(id) {
    currentTheme = id;
    if (id === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", id);
    try { localStorage.setItem("gr-theme", id); } catch (e) { /* ignoré */ }
    applyRouteColor();
    document.querySelectorAll(".swatch").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.id === id)));
  }
  function renderThemes() {
    const box = $("themes");
    THEMES.forEach((t) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "swatch";
      b.dataset.id = t.id;
      b.style.setProperty("--c", t.swatch);
      b.title = t.name;
      b.setAttribute("aria-label", `Thème ${t.name}`);
      b.addEventListener("click", () => setTheme(t.id));
      box.appendChild(b);
    });
    setTheme(currentTheme);
  }
  renderThemes();

  // ---------- Boutons ----------
  $("favDest").addEventListener("click", () => { if (state.dest) toggleFavorite(state.dest); });
  loadPlaces();
  renderPlaces();
  updateFavBtn();
  $("altBtn").addEventListener("click", showAlternatives);
  $("altClose").addEventListener("click", closeAlternatives);
  $("altGo").addEventListener("click", chooseAlternative);
  $("goBtn").addEventListener("click", startNav);
  $("stopNav").addEventListener("click", stopNav);
  function syncSoundUI() {
    const on = SOUND.guide || SOUND.alerts;
    $("mute").innerHTML = on ? "&#128266;" : "&#128263;";
    $("mute").setAttribute("aria-label", on ? "Couper la voix" : "Activer la voix");
    $("togGuide").setAttribute("aria-pressed", String(SOUND.guide));
    $("togGuide").textContent = SOUND.guide ? "Activée" : "Coupée";
    $("togAlerts").setAttribute("aria-pressed", String(SOUND.alerts));
    $("togAlerts").textContent = SOUND.alerts ? "Activées" : "Coupées";
  }
  $("mute").addEventListener("click", () => {
    const on = SOUND.guide || SOUND.alerts;
    SOUND.guide = SOUND.alerts = !on;
    saveSound(); syncSoundUI();
  });
  $("togGuide").addEventListener("click", () => { SOUND.guide = !SOUND.guide; saveSound(); syncSoundUI(); });
  $("togAlerts").addEventListener("click", () => { SOUND.alerts = !SOUND.alerts; saveSound(); syncSoundUI(); });
  $("settingsBtn").addEventListener("click", () => $("settings").classList.remove("hidden"));
  $("settingsNav").addEventListener("click", () => $("settings").classList.remove("hidden"));
  $("settingsClose").addEventListener("click", () => $("settings").classList.add("hidden"));
  syncSoundUI();
  $("locate").addEventListener("click", () => {
    state.followUser = true;
    if (state.pos) map.easeTo({ center: [state.pos.lon, state.pos.lat], zoom: 16, duration: 500 });
  });

  // Démarrage du suivi GPS au chargement (la voix se débloque au premier clic utilisateur)
  startTracking();
  renderLimit();
  initCommunity();

  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
</body>
</html>
